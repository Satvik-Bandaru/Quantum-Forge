name: Regression

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QF_PYTHON: python
      PLAYWRIGHT_BROWSER: chromium
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: |
          python -m pip install -r requirements.lock.txt
          npm --prefix frontend ci
      - name: Install Chromium and system dependencies
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Check dependencies, backend, production build and full browser suite
        run: bash scripts/check-regression.sh
      - name: Upload verification evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: regression-evidence
          retention-days: 14
          path: |
            docs/verification/regression/
            frontend/playwright-report/
            frontend/test-results/
            docs/screenshots/
            docs/main-lab-verification-bell.json
